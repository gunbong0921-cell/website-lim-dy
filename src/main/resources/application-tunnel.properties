# Cloudflare Quick Tunnel / named tunnel. --spring.profiles.active=tunnel
# SPA와 API는 공개 https 와 같은 출처. DB는 로컬 Oracle, Redis는 .env 그대로.
# 캡차는 *.trycloudflare.com 만 끈다(CaptchaPolicy). 이 파일이 recaptcha.enabled 를 끄지 않는다.
server.forward-headers-strategy=framework
server.tomcat.remoteip.remote-ip-header=X-Forwarded-For
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto

spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

app.security.trusted-proxy=${TRUSTED_PROXY:true}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8282,http://127.0.0.1:8282,https://*.trycloudflare.com}
