# Hexaq. 비밀값은 .env 만. 키 목록은 .env.example.
# 상세: [docs/technical/02-technical-specification.md](../../../docs/technical/02-technical-specification.md) · [docs/technical/04-redis.md](../../../docs/technical/04-redis.md)
spring.config.import=optional:file:.env[.properties]

spring.application.name=website-lim-dy

# SPA+API 한 출처. 터널도 이 포트로 붙는다.
server.port=8282
server.error.include-message=never
server.error.include-stacktrace=never

# 로컬·tunnel: Oracle. prod 프로필은 application-prod.properties 가 MariaDB 드라이버로 덮는다.
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 회원·카카오친구만 JPA. 게시판 테이블은 schema.sql / schema-mariadb.sql (MyBatis).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

mybatis.mapper-locations=classpath:mybatis/mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.edu.springboot.domain.board

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.mail.host=${MAIL_HOST:smtp.naver.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.naver.com}

app.solapi.api-key=${SOLAPI_API_KEY}
app.solapi.api-secret=${SOLAPI_API_SECRET}
app.solapi.from=${SOLAPI_SENDER}

# Redis: 인증 코드·HMAC 티켓·이상 탐지. 회원·게시글 원본이 아니다.
# redis 이면 기동 중 REDIS_HOST:REDIS_PORT 에 도달해야 한다. 로컬만이면 memory.
# 세 포트가 같은 스위치(PHONE_VERIFY_STORE)를 쓴다. 상세 docs/technical/04-redis.md
app.phone-verify.store=${PHONE_VERIFY_STORE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

app.nts.base-url=https://api.odcloud.kr/api/nts-businessman/v1
app.nts.service-key=${NTS_SERVICE_KEY}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8282/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8282/login/oauth2/code/github

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8282/login/oauth2/code/kakao}
spring.security.oauth2.client.registration.kakao.scope=talk_message
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
app.oauth.success-redirect=/#/
app.oauth.failure-redirect=/#/login
app.kakao.guide-url=http://localhost:8282/#/insights

app.admin.login-id=${ADMIN_LOGIN_ID}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:관리자}
app.admin.email=${ADMIN_EMAIL}
app.admin.phone=${ADMIN_PHONE}

# 홈페이지는 연다. 아래는 남용만 줄인다. IP 레이트 리밋은 프로세스 메모리(Redis 아님).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8282,http://127.0.0.1:8282,https://*.trycloudflare.com}
app.security.trusted-proxy=${TRUSTED_PROXY:false}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.security.rate-limit.api-per-window=${RATE_LIMIT_API:60}
app.security.rate-limit.auth-per-window=${RATE_LIMIT_AUTH:10}
app.security.rate-limit.page-per-window=${RATE_LIMIT_PAGE:300}

# *.trycloudflare.com 은 콘솔 미등록이라 CaptchaPolicy.requiredOnHost 가 끈다. localhost 는 켠다.
app.recaptcha.enabled=${RECAPTCHA_ENABLED:true}
app.recaptcha.site-key=${RECAPTCHA_SITE_KEY:}
app.recaptcha.secret-key=${RECAPTCHA_SECRET_KEY:}
app.recaptcha.min-score=${RECAPTCHA_MIN_SCORE:0.5}
app.recaptcha.verify-url=https://www.google.com/recaptcha/api/siteverify

# HMAC 티켓 TTL 은 Redis REQ_TICKET: 키와 같다.
app.request-signing.enabled=${REQUEST_SIGNING_ENABLED:true}
app.request-signing.ticket-ttl-seconds=${REQUEST_TICKET_TTL_SECONDS:60}
app.request-signing.max-skew-seconds=${REQUEST_SIGNING_MAX_SKEW_SECONDS:300}

# 이상 탐지 신호는 Redis ANOMALY:* . 회원 trust_status 는 DB.
app.anomaly.enabled=${ANOMALY_GUARD_ENABLED:true}
app.anomaly.ttfa-ms=${ANOMALY_TTFA_MS:3000}
app.anomaly.new-user-age-hours=${ANOMALY_NEW_USER_AGE_HOURS:24}
app.anomaly.new-user-limit=${ANOMALY_NEW_USER_LIMIT:5}
app.anomaly.new-user-window-seconds=${ANOMALY_NEW_USER_WINDOW_SECONDS:60}
app.anomaly.nav-lookback-seconds=${ANOMALY_NAV_LOOKBACK_SECONDS:300}
app.anomaly.nav-max-entries=${ANOMALY_NAV_MAX_ENTRIES:50}
app.anomaly.direct-hit-limit=${ANOMALY_DIRECT_HIT_LIMIT:1}
app.anomaly.signup-ttl-hours=${ANOMALY_SIGNUP_TTL_HOURS:24}
app.anomaly.step-ttl-hours=${ANOMALY_STEP_TTL_HOURS:24}

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
