spring.config.import=optional:file:.env[.properties]

spring.application.name=website-lim-dy

server.port=8282
server.error.include-message=never
server.error.include-stacktrace=never

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

mybatis.mapper-locations=classpath:mybatis/mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.edu.springboot.domain.board

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.mail.host=${MAIL_HOST:smtp.naver.com}
spring.mail.port=${MAIL_PORT:465}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.naver.com}

app.solapi.api-key=${SOLAPI_API_KEY}
app.solapi.api-secret=${SOLAPI_API_SECRET}
app.solapi.from=${SOLAPI_SENDER}

app.phone-verify.store=${PHONE_VERIFY_STORE:redis}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

app.nts.base-url=https://api.odcloud.kr/api/nts-businessman/v1
app.nts.service-key=${NTS_SERVICE_KEY}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8282/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=http://localhost:8282/login/oauth2/code/github

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8282/login/oauth2/code/kakao}
spring.security.oauth2.client.registration.kakao.scope=talk_message
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
app.oauth.success-redirect=/#/
app.oauth.failure-redirect=/#/login
app.kakao.guide-url=http://localhost:8282/#/insights

app.admin.login-id=${ADMIN_LOGIN_ID}
app.admin.password=${ADMIN_PASSWORD}
app.admin.name=${ADMIN_NAME:관리자}
app.admin.email=${ADMIN_EMAIL}
app.admin.phone=${ADMIN_PHONE}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8282,http://127.0.0.1:8282}
app.security.trusted-proxy=${TRUSTED_PROXY:false}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.security.rate-limit.api-per-window=${RATE_LIMIT_API:60}
app.security.rate-limit.auth-per-window=${RATE_LIMIT_AUTH:10}
app.security.rate-limit.page-per-window=${RATE_LIMIT_PAGE:300}

spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
