# 운영(prod)은 MariaDB. 로컬·tunnel 은 Oracle.
# DB_URL 예: jdbc:mariadb://{host}:3306/{db}
# 게시판 DDL 은 Hibernate 가 안 만든다. schema-mariadb.sql 필요.
# Redis 는 이 파일이 덮지 않는다. REDIS_HOST / PHONE_VERIFY_STORE 는 .env.
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.sql.init.schema-locations=classpath:schema-mariadb.sql

# 운영 전용 OAuth 클라이언트. GOOGLE_* / GITHUB_* / KAKAO_* 환경 변수를 반드시 설정한다.
# GitHub OAuth App은 Callback URL을 하나만 둘 수 있으므로 Hexaq-Prod 앱을 따로 만든다.
# Google 리디렉션 URI 예: https://{운영도메인}/login/oauth2/code/google
# GitHub Callback URL 예: https://{운영도메인}/login/oauth2/code/github
# Kakao Redirect URI 예: https://{운영도메인}/login/oauth2/code/kakao
# 리버스 프록시 뒤에서만 TRUSTED_PROXY=true 로 두고, CORS_ALLOWED_ORIGINS 에 실제 도메인을 넣는다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.trusted-proxy=${TRUSTED_PROXY:true}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}
app.security.rate-limit.api-per-window=${RATE_LIMIT_API:60}
app.security.rate-limit.auth-per-window=${RATE_LIMIT_AUTH:10}
app.security.rate-limit.page-per-window=${RATE_LIMIT_PAGE:300}
